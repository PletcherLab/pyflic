about:
  run: R-20261116-christi-01
  title: Jove Males Crowding PR Run 2
  purpose: Testing whether crowding affect progressive ratio parameters
  experimenter: christi
  series: jove-pr-males
  organism: Drosophila melanogaster
  sex:
  - male
  age_at_start: 10 Days
  protocol:
    name: FLIC progressive ratio
    version: 4.0.1
  notes: Standard use
  factors:
    Genotype:
      kind: genotype
      levels:
        W: This is the control genotype, backcrossed to Chr. The actual genotype is
          NPFxW.
        Chr: This is the activating genotype, NPF>Chr in which NPF neurons are activated
          by red light to stimulate reward.
    Density:
      kind: treatment
      levels:
        20x: This treatment described the density of 20 adult flies per vial prior
          to treatment.
        40x: This treatment described the density of 40 adult flies per vial prior
          to treatment.
